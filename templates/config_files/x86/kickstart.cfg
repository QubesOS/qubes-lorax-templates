# Qubes OS kickstart file for USB installer media.
#
# This file is copied to the writable EFI partition as:
#
#   EFI/BOOT/ks.cfg
#
# To use it:
#
#   1. Write the Qubes OS ISO to a USB drive.
#   2. Mount the partition labelled ANACONDA read-write.
#   3. Edit EFI/BOOT/ks.cfg.
#   4. Boot the USB drive and select:
#
#      Install Qubes OS using kickstart from USB
#
# All settings below are commented out by default. Uncomment and adjust only
# the options you want to automate. Disk and partitioning commands can erase
# existing data without further confirmation.
#
# Editing this partition after writing the image is expected to invalidate
# media-check hashes for the USB drive.

# Basic installer settings.
#lang en_US.UTF-8
#keyboard --xlayouts='us'
#timezone Etc/UTC --utc

# The boot menu supplies the installer source. A kickstart used from this file
# normally does not need a cdrom, harddrive, url, or repo command.

# Use graphical or text installer mode.
#graphical
#text

# Select the target disk. Replace nvme0n1 with the intended install disk.
#ignoredisk --only-use=nvme0n1

# Clear the selected disk and create a fresh partition table.
#clearpart --all --initlabel --drives=nvme0n1
#zerombr

# Let Anaconda create the default encrypted LVM layout.
#autopart --type=lvm --encrypted --passphrase=CHANGE_ME

# Or define an encrypted layout manually instead of using autopart.
#part /boot/efi --fstype=efi --size=600 --ondisk=nvme0n1
#part /boot --fstype=ext4 --size=1024 --ondisk=nvme0n1
#part pv.01 --grow --encrypted --passphrase=CHANGE_ME --ondisk=nvme0n1
#volgroup qubes_dom0 pv.01
#logvol / --vgname=qubes_dom0 --name=root --fstype=ext4 --size=20480 --grow
#logvol swap --vgname=qubes_dom0 --name=swap --recommended

# Configure boot loader placement and kernel command line.
#bootloader --location=mbr --append="rhgb quiet"

# Create a user. Replace the password before using --plaintext.
#rootpw --lock
#user --name=user --groups=wheel --password=CHANGE_ME --plaintext

# Reboot when installation is complete.
#reboot
